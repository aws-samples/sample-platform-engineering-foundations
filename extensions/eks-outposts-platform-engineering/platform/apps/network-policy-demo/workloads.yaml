---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-netpol
  labels: {app.kubernetes.io/part-of: demo-netpol}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo-netpol
  labels: {app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: demo-netpol}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: demo-netpol}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: harbor.local/apps/podinfo:6.15.0@sha256:ec73780a8425f59ea49f5bc8cdff0d598805a224fbaa1f86c67a244f250fa9da
          imagePullPolicy: IfNotPresent
          command: [./podinfo, --port=8080, --level=info, --ui-message=frontend]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            exec: {command: [wget, -q, -O, /dev/null, "http://127.0.0.1:8080/readyz"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: demo-netpol
  labels: {app.kubernetes.io/name: backend, app.kubernetes.io/part-of: demo-netpol}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: backend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: backend, app.kubernetes.io/part-of: demo-netpol}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: harbor.local/apps/podinfo:6.15.0@sha256:ec73780a8425f59ea49f5bc8cdff0d598805a224fbaa1f86c67a244f250fa9da
          imagePullPolicy: IfNotPresent
          command: [./podinfo, --port=8080, --level=info, --ui-message=backend]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            exec: {command: [wget, -q, -O, /dev/null, "http://127.0.0.1:8080/readyz"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: demo-netpol
  labels: {app.kubernetes.io/name: db, app.kubernetes.io/part-of: demo-netpol}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: db}
  template:
    metadata:
      labels: {app.kubernetes.io/name: db, app.kubernetes.io/part-of: demo-netpol}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: db
          image: harbor.local/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          imagePullPolicy: IfNotPresent
          command: [nc, -lk, -p, "5432", -e, echo, db-ok]
          ports:
            - {name: tcp-db, containerPort: 5432}
          readinessProbe:
            exec: {command: [sh, -c, "nc -w 1 127.0.0.1 5432 </dev/null | grep -q db-ok"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: demo-netpol
  labels: {app.kubernetes.io/name: backend, app.kubernetes.io/part-of: demo-netpol}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: backend}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: demo-netpol
  labels: {app.kubernetes.io/name: db, app.kubernetes.io/part-of: demo-netpol}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: db}
  ports:
    - {name: tcp-db, port: 5432, targetPort: tcp-db}

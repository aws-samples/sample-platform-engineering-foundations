---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: harbor-database
  namespace: registry-local
  labels: {app.kubernetes.io/part-of: platform-pdb}
spec:
  maxUnavailable: 0
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels: {release: harbor, app: harbor, component: database}

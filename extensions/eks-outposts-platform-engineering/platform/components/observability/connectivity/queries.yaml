# Single source of the connectivity queries of the egress cut demo (MetricsQL, VictoriaMetrics v1.152.0).
#
# Not a manifest: no Argo CD Application reads this directory. Consumers, all checked against it:
#   - ../dashboards/platform-connectivity-dashboard.yaml: every Grafana target and annotation has a `refId`
#     (or `name`) equal to the `id` here and an `expr` identical byte for byte (tests/test_connectivity.py);
#   - tests/test_connectivity.py --live-url: runs every `expr` on the cluster vmsingle, with a positive control
#     before trusting any empty result;
#   - QUERIES.md: generated by tests/test_queries_doc.py --write and checked byte for byte by the same test.
#
# Series vocabulary, produced by ../../chaos-egress/egress_chaos.py:
#   platform_probe_success                   1 = the TCP connect succeeded in the sample, 0 = it did not
#   platform_probe_latency_seconds           connect duration, timeout included
#   platform_probe_sample_timestamp_seconds  start epoch of the sample of that target (age = staleness)
#   labels: vantage="cut|control", target_class="region|internet|local", target_name="<host:port>"
#   up{vantage=...}                          the scrape itself; the label comes from the probe Service (targetLabels)
#
# stale_after_seconds: a sample older than this is not a state. It covers interval_seconds up to 30 s plus one
# whole probe round (round_budget of egress_chaos.py) and the 10 s scrape interval. egress_chaos.py uses the same
# number (STALE_AFTER_S); the test fails if they diverge.
#
# kind: panel = Grafana panel target; annotation = Grafana annotation; explore = VMUI only.
# live: what --live-url requires. require=probes: only during the run, with the probes up. require=always: must
# always return a series. require=optional: may be empty (a namespace that exists only during the scene).
version: 1
stale_after_seconds: 90
queries:
  - id: connectivity_state
    kind: panel
    panel: Connectivity State Timeline
    title: UP/DOWN state per vantage and class, fresh samples only
    expr: |-
      min by (vantage, target_class) (platform_probe_success and on (vantage, target_class, target_name) (time() - platform_probe_sample_timestamp_seconds < 90))
    live: {require: probes, by: [vantage, target_class]}

  - id: probe_samples_fresh
    kind: panel
    panel: Connectivity State Timeline
    title: Whether any probe has a fresh sample (1 = FRESH, 0 = NO SAMPLE); the series is always present
    # A window without probe samples makes the Grafana 13 datasource return ONE frame without fields for
    # connectivity_state, and the state-timeline shows "Data does not have a time field" instead of "No data".
    # This series never disappears (`or vector(0)`), so the panel always has a time field and the row says why the
    # UP/DOWN rows are empty. It does not change connectivity_state: a stale sample stays a gap, never DOWN.
    expr: |-
      (count(platform_probe_success and on (vantage, target_class, target_name) (time() - platform_probe_sample_timestamp_seconds < 90)) > bool 0) or vector(0)
    live: {require: always, by: []}

  - id: local_services_probe
    kind: panel
    panel: Local Services
    title: Local services seen from INSIDE the cut, per target
    expr: |-
      min by (target_name) (platform_probe_success{vantage="cut",target_class="local"} and on (vantage, target_class, target_name) (time() - platform_probe_sample_timestamp_seconds{vantage="cut",target_class="local"} < 90))
    live: {require: probes, by: [target_name]}

  - id: local_workloads_ready
    kind: panel
    panel: Local Services
    title: Retail Store Deployments with an available replica (no network probe, from kube-state-metrics)
    expr: |-
      min by (namespace, deployment) (kube_deployment_status_replicas_available{namespace=~"retail-.+"} > bool 0)
    live: {require: optional, by: [namespace, deployment]}

  - id: scrape_up
    kind: panel
    panel: Scrape Integrity
    title: vmagent reaches the probe of each vantage
    expr: |-
      max by (vantage) (up{namespace=~"egress-chaos-probe|egress-chaos-control"})
    live: {require: probes, by: [vantage]}

  - id: sample_age
    kind: panel
    panel: Scrape Integrity
    title: Age of the oldest sample per vantage and class (above 90 s is stale)
    expr: |-
      max by (vantage, target_class) (time() - platform_probe_sample_timestamp_seconds)
    live: {require: probes, by: [vantage, target_class]}

  - id: vantage_series
    kind: panel
    panel: Scrape Integrity
    title: Series per vantage; without control there is no proof that the Region is up
    expr: |-
      count by (vantage) (platform_probe_success)
    live: {require: probes, by: [vantage]}

  - id: unavailable_seconds
    kind: panel
    panel: Unavailable seconds
    title: Seconds with the class DOWN in the last 15 minutes (10 s step; a class never DOWN shows 0)
    # Subquery with an EXPLICIT step: `(...)[15m]` without a step returns empty on v1.152.0.
    expr: |-
      sum_over_time((min by (vantage, target_class) (platform_probe_success) == bool 0)[15m:10s]) * 10
    live: {require: optional, by: [vantage, target_class]}

  - id: region_transition
    kind: annotation
    title: Region changes state in the cut vantage (observed start and end of the cut)
    expr: |-
      changes(platform_probe_success{vantage="cut",target_class="region"}[1m]) > 0
    live: {require: optional, by: []}

  - id: retail_namespace_created
    kind: annotation
    title: Retail Store namespace created by the Argo CD sync (value = instant, in ms)
    expr: |-
      kube_namespace_created{namespace=~"retail-.+"} * 1000
    live: {require: optional, by: [namespace]}

  - id: retail_ready
    kind: annotation
    title: Retail Store with every Deployment having a ready replica
    expr: |-
      min by (namespace) (kube_deployment_status_replicas_ready{namespace=~"retail-.+"}) >= 1
    live: {require: optional, by: [namespace]}

  - id: namespaces
    kind: explore
    title: Pods per namespace
    expr: |-
      count by (namespace) (kube_pod_info)
    live: {require: always, by: [namespace]}

  - id: pod_ip_node
    kind: explore
    title: Pod, IP and node of a namespace (replace demo-netpol with any namespace)
    expr: |-
      max by (namespace, pod, pod_ip, node) (kube_pod_info{namespace="demo-netpol"})
    live: {require: always, by: [namespace, pod, pod_ip, node]}

  - id: probe_by_target
    kind: explore
    title: Result of each target in both vantages (1 = open, 0 = not open)
    expr: |-
      max by (vantage, target_class, target_name) (platform_probe_success)
    live: {require: probes, by: [vantage, target_class, target_name]}

  - id: probe_latency
    kind: explore
    title: Connect latency of each target; close to 4 s is the probe timeout, not slowness
    expr: |-
      max by (vantage, target_class, target_name) (platform_probe_latency_seconds)
    live: {require: probes, by: [vantage, target_class, target_name]}

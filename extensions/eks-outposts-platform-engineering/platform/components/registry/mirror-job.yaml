apiVersion: v1
kind: ServiceAccount
metadata: {name: ecr-mirror, namespace: registry-local}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: platform-image-mirror
  namespace: registry-local
  labels: {app.kubernetes.io/component: mirror, app.kubernetes.io/part-of: registry-local}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels: {app.kubernetes.io/component: mirror, app.kubernetes.io/part-of: registry-local}
    spec:
      serviceAccountName: ecr-mirror
      restartPolicy: Never
      hostAliases:
        - ip: "${REGISTRY_SERVICE_IP}"
          hostnames: [harbor.local]
      containers:
        - name: crane
          image: gcr.io/go-containerregistry/crane:debug@sha256:e78770b31258a3846f878036d9c1f63fbe4c871f9f56990bf77fd95c013e3c1b
          command: [/busybox/sh, /script/run.sh]
          env:
            - name: HARBOR_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: harbor-admin, key: HARBOR_ADMIN_PASSWORD}}
          volumeMounts:
            - {name: script, mountPath: /script}
            - {name: inventory, mountPath: /input}
            - {name: ca, mountPath: /ca}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: script
          configMap: {name: platform-image-mirror-script, defaultMode: 0755}
        - name: inventory
          configMap: {name: platform-image-inventory}
        - name: ca
          configMap: {name: harbor-ca}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: platform-image-mirror-script, namespace: registry-local}
data:
  run.sh: |
    #!/busybox/sh
    set -u
    export HOME=/tmp DOCKER_CONFIG=/tmp/.docker SSL_CERT_FILE=/ca/ca.crt
    echo "$HARBOR_ADMIN_PASSWORD" | crane auth login harbor.local -u admin --password-stdin
    failures=0
    while IFS='|' read -r source destination; do
      case "${source:-}" in ''|\#*) continue;; esac
      pinned="${source%@*}"
      case "$source" in *@sha256:*) source="${pinned%:*}@${source##*@}";; esac
      if crane copy "$source" "harbor.local/$destination"; then
        echo "MIRROR_OK $destination"
      else
        echo "MIRROR_FAILED $destination"; failures=$((failures+1))
      fi
    done < /input/images.txt
    test "$failures" -eq 0

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: registry-local
  labels: {app.kubernetes.io/part-of: platform-networkpolicies}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: registry-local
  labels: {app.kubernetes.io/part-of: platform-networkpolicies}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: registry-local
  labels: {app.kubernetes.io/part-of: platform-networkpolicies}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pull-from-nodes
  namespace: registry-local
  labels: {app.kubernetes.io/part-of: platform-networkpolicies}
spec:
  podSelector:
    matchLabels: {app: harbor, release: harbor, component: nginx}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: "${OUTPOST_SUBNET_CIDR}"
      ports:
        - {protocol: TCP, port: 8443}
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubelet-probes
  namespace: registry-local
  labels: {app.kubernetes.io/part-of: platform-networkpolicies}
spec:
  podSelector:
    matchLabels: {app: harbor, release: harbor}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: "${OUTPOST_SUBNET_CIDR}"
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8443}
        - {protocol: TCP, port: 5000}
        - {protocol: TCP, port: 6379}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mirror-egress
  namespace: registry-local
  labels: {app.kubernetes.io/part-of: platform-networkpolicies}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: mirror}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: ["169.254.169.254/32"]
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - {protocol: TCP, port: 80}

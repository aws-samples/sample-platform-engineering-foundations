---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: default
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: fluent-bit
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: fluent-bit
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {k8s-app: kube-dns}}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver
  namespace: fluent-bit
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: fluent-bit}}
  policyTypes: [Egress]
  egress:
  - to: [{ipBlock: {cidr: "${KUBERNETES_SERVICE_IP_CIDR}"}}, {ipBlock: {cidr: "${OUTPOST_SUBNET_CIDR}"}}]
    ports: [{protocol: TCP, port: 443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubelet-probes
  namespace: fluent-bit
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: fluent-bit}}
  policyTypes: [Ingress]
  ingress:
  - from: [{ipBlock: {cidr: "${OUTPOST_SUBNET_CIDR}"}}]
    ports: [{protocol: TCP, port: 2020}]

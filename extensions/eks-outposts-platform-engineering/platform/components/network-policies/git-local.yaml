---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: git-local
  labels: {app.kubernetes.io/part-of: platform-networkpolicies}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: git-local
  labels: {app.kubernetes.io/part-of: platform-networkpolicies}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: git-local
  labels: {app.kubernetes.io/part-of: platform-networkpolicies}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-argocd
  namespace: git-local
  labels: {app.kubernetes.io/part-of: platform-networkpolicies}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: gitea, app.kubernetes.io/instance: gitea}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: argocd}
      ports:
        - {protocol: TCP, port: 3000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubelet-probes
  namespace: git-local
  labels: {app.kubernetes.io/part-of: platform-networkpolicies}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: gitea, app.kubernetes.io/instance: gitea}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: "${OUTPOST_SUBNET_CIDR}"
      ports:
        - {protocol: TCP, port: 3000}

expose:
  type: clusterIP
  tls:
    enabled: true
    certSource: secret
    secret: {secretName: harbor-tls}
  clusterIP: {name: harbor, staticClusterIP: "172.20.0.20"}
externalURL: https://harbor.local
existingSecretAdminPassword: harbor-admin
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
persistence:
  enabled: true
  persistentVolumeClaim:
    registry: {storageClass: platform-ebs-gp2, size: 40Gi}
    database: {storageClass: platform-ebs-gp2, size: 10Gi}
    redis: {storageClass: platform-ebs-gp2, size: 5Gi}
    jobservice: {jobLog: {storageClass: platform-ebs-gp2, size: 1Gi}}
database: {type: internal}
redis: {type: internal}
trivy: {enabled: false}
updateStrategy: {type: Recreate}

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: platform-root, namespace: argocd}
spec:
  project: default
  source:
    repoURL: http://gitea-http.git-local.svc.cluster.local:3000/platform-admin/platform-demo.git
    targetRevision: main
    path: gitops
    directory: {include: applicationset.yaml}
  destination: {server: https://kubernetes.default.svc, namespace: argocd}
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    syncOptions: [CreateNamespace=true]
    retry: {limit: 10, backoff: {duration: 30s, maxDuration: 5m}}

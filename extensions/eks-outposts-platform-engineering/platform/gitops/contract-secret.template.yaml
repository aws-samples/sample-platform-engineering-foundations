apiVersion: v1
kind: Secret
metadata:
  name: "${CLUSTER_NAME}"
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    enable_platform: "true"
  annotations:
    cluster_name: "${CLUSTER_NAME}"
    aws_region: "${AWS_REGION}"
    account_id: "${ACCOUNT_ID}"
    outpost_arn: "${OUTPOST_ARN}"
    local_cluster_version: "${KUBERNETES_VERSION}"
    registry_service_ip: "${REGISTRY_SERVICE_IP}"
    node_subnet_cidr: "${NODE_SUBNET_CIDR}"
    bastion_subnet_cidr: "${BASTION_SUBNET_CIDR}"
    kubernetes_service_ip_cidr: "${KUBERNETES_SERVICE_IP_CIDR}"
    cluster_dns_service_ip: "${CLUSTER_DNS_SERVICE_IP}"
    ebs_csi_controller_credential_cidr: "${EBS_CSI_CONTROLLER_CREDENTIAL_CIDR}"
    gitea_repo: "${GITEA_REPO}"
type: Opaque
stringData:
  name: in-cluster
  server: https://kubernetes.default.svc
  config: '{"tlsClientConfig":{"insecure":false}}'

apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xcontainer.compute.platform.cloud
  labels:
    compute.platform.cloud/type: container
    container.compute.platform.cloud/version: v0.0.1
spec:
  compositeTypeRef:
    apiVersion: compute.platform.cloud/v1alpha1
    kind: XContainer
  mode: Pipeline
  pipeline:
    - step: create-resources
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        patchSets:
          - name: deletionPolicy
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.deletionPolicy
                toFieldPath: spec.deletionPolicy
          - name: providerConfigRef
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.providerConfigRef
                toFieldPath: spec.providerConfigRef
          - name: namespace
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.namespace
                toFieldPath: spec.forProvider.manifest.metadata.namespace

        resources:
          - name: deployment
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha1
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: apps/v1
                    kind: Deployment
            patches:
              - patchSetName: providerConfigRef
                type: PatchSet
              - patchSetName: deletionPolicy
                type: PatchSet
              - patchSetName: namespace
                type: PatchSet
              - fromFieldPath: spec.parameters.name
                toFieldPath: spec.forProvider.manifest.metadata.labels.app
              - fromFieldPath: spec.parameters.name
                toFieldPath: spec.forProvider.manifest.spec.selector.matchLabels.app
              - fromFieldPath: spec.parameters.name
                toFieldPath: spec.forProvider.manifest.spec.template.metadata.labels.app
              - fromFieldPath: spec.parameters.deployment.replicas
                toFieldPath: spec.forProvider.manifest.spec.replicas
              - fromFieldPath: spec.parameters.deployment.revisionHistoryLimit
                toFieldPath: spec.forProvider.manifest.spec.revisionHistoryLimit
              - fromFieldPath: spec.parameters.deployment.containers
                toFieldPath: spec.forProvider.manifest.spec.template.spec.containers
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-deployment"

          - name: service
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha1
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Service
            patches:
              - patchSetName: providerConfigRef
                type: PatchSet
              - patchSetName: deletionPolicy
                type: PatchSet
              - patchSetName: namespace
                type: PatchSet
              - fromFieldPath: spec.parameters.service.ports
                toFieldPath: spec.forProvider.manifest.spec.ports
              - fromFieldPath: spec.parameters.name
                toFieldPath: spec.forProvider.manifest.spec.selector.app
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.service.name
                toFieldPath: spec.forProvider.manifest.metadata.name
              - fromFieldPath: spec.parameters.service.annotations
                toFieldPath: spec.forProvider.manifest.metadata.annotations

          - name: ingress
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha1
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: networking.k8s.io/v1
                    kind: Ingress
            patches:
              - patchSetName: providerConfigRef
                type: PatchSet
              - patchSetName: deletionPolicy
                type: PatchSet
              - patchSetName: namespace
                type: PatchSet
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-ingress"
              - fromFieldPath: spec.parameters.ingress.annotations
                toFieldPath: spec.forProvider.manifest.metadata.annotations
              - fromFieldPath: spec.parameters.ingress.rules
                toFieldPath: spec.forProvider.manifest.spec.rules
              - fromFieldPath: spec.parameters.ingress.ingressClassName
                toFieldPath: spec.forProvider.manifest.spec.ingressClassName

    - step: automatically-detect-readiness
      functionRef:
        name: function-auto-ready

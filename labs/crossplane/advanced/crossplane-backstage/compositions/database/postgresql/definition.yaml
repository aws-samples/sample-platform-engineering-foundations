apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xpostgresqls.database.platform.cloud
spec:
  group: database.platform.cloud
  names:
    kind: XPostgresql
    plural: xpostgresqls
  claimNames:
    kind: Postgresql
    plural: postgresqls
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              properties:
                parameters:
                  type: object
                  description: >-
                    Object of parameters to configure the database.
                  properties:
                    providerConfigRef:
                      type: object
                      description: "It tells the Provider which ProviderConfig to use when creating the managed resource"
                      properties:
                        name:
                          description: "Name of the ProviderConfig to use"
                          type: string
                          default: "default"
                    region:
                      type: string
                      description: >-
                        Region is the resources is located.
                    deletionPolicy:
                      type: string
                      description: >-
                        DeletionPolicy specifies what will happen to the underlying external 
                        when this managed resource is deleted
                        either "Delete" or "Orphan" the external resource.
                      default: Delete
                    instanceClass:
                      type: string
                      description: >-
                        The machine instanceClass for this PostgreSQL Instance.
                    storage:
                      type: integer
                      description: >-
                        The storage size for this PostgreSQL Instance in GB.
                    backupRetentionPeriod:
                      type: integer
                      description: >-
                        The days to retain backups for. Must be between 0 and 35. 
                        Default is 0. Must be greater than 0 if the database is used as a 
                        source for a Read Replica, uses low-downtime updates, 
                        or will use RDS Blue/Green deployments.
                      default: 0
                    username:
                      type: string
                      description: >-
                        Username for the master DB user.
                    subnetIds:
                      type: array
                      description: >-
                        A list of VPC subnet IDs.
                      items:
                        type: string
                    securityGroupIds:
                      type: array
                      description: >-
                        VPC security groups associated
                        with the db.
                      items:
                        type: string
                    port:
                      description: >-
                        Port number of the database to create when the DB instance is created.
                      type: number
                    dbName:
                      description: >-
                        Database name to use by the applications.
                      type: string
                    secretNamespace:
                      description: >-
                        Namespace to save the secrets
                      default: "default"
                      type: string
                    tags:
                      description: Key-value map of tags. This object accepts the maximum number of 40 tags.
                      type: object
                      maxProperties: 40
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                    - region
                    - deletionPolicy
                    - dbName
                    - instanceClass
                    - storage
                    - backupRetentionPeriod
                    - username
                    - subnetIds
                    - securityGroupIds
                    - port
                    - tags
              required:
                - parameters
            status:
              properties:
                database:
                  type: object
                  description: >-
                    Object with relevant information resulting from 
                    the cahce to be used by other compositions.
                  properties:
                    subnetGroup:
                      type: object
                      description: >-
                        SubnetGroupStatus defines the observed state of SubnetGroup.
                      properties:
                        name:
                          type: string
                          description: >-
                            Subgroup name created for the database
                        vpcId:
                          type: string
                          description: >-
                            Vpc ID of the subnets used to create the subnetGroup
                    securityGroup:
                      type: object
                      description: >-
                        SecurityGroup defines the observed state of SecurityGroup.
                      properties:
                        id:
                          type: string
                          description: >-
                            ID of the created security group
                    address:
                      description: >-
                        Address to access the database.
                      type: string
                    port:
                      description: >-
                        Port to access the database.
                      type: number
                    username:
                      description: >-
                        Username to access database.
                      type: string
                    dbName:
                      description: >-
                        Database name to use by the applications.
                      type: string
                    key:
                      type: object
                      description: >-
                        Key information created to encrypt the database
                      properties:
                        arn:
                          type: string
                          description: >-
                            The Amazon Resource Name (ARN) of the key
                    masterUserSecretArn:
                      description: >-
                        Arn of of the connection data in aws secrets manager
                      type: string
              type: object
          required:
            - spec

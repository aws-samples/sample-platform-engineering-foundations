apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: default-drc
  namespace: crossplane-system
spec:
  deploymentTemplate:
    spec:
      replicas: 1
      selector: {}
      template:
        spec:
          serviceAccountName: aws-providers-sa
          containers:
            - name: package-runtime
              args:
                - '--leader-election'
                - '--poll=5m'
                - '--max-reconcile-rate=1'
              # Requests make EKS Auto Mode provision capacity for the providers. Without
              # them a dozen providers pack onto one small node, starve for CPU, lose
              # leader election and stop serving their conversion webhooks.
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi

apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: default-drc
  namespace: crossplane-system
spec:
  deploymentTemplate:
    spec:
      replicas: 1
      selector: {}
      template:
        spec:
          serviceAccountName: aws-providers-sa
          containers:
            - name: package-runtime
              # No --leader-election: every provider runs a single replica, so there is no
              # second pod to fail over to. With it enabled, a provider that is slow to renew
              # its lease (CPU-starved during startup) exits with "leader election lost" and
              # restarts from zero. Measured on 2026-10-09 in a fresh event: iam, lambda, rds
              # and the family provider all restarted that way.
              args:
                - '--poll=5m'
                - '--max-reconcile-rate=1'
              # Each Upbound provider loads its full Terraform schema at startup and needs
              # close to one vCPU for a few minutes before it logs anything or opens its
              # webhook (9443). With 100m requests, ten providers packed onto one c6a.large
              # (1780m allocatable), sat silent for 15+ minutes and Compositions failed with
              # "conversion webhook ... connection refused". 500m makes EKS Auto Mode spread
              # them over enough capacity to start in parallel.
              resources:
                requests:
                  cpu: 500m
                  memory: 384Mi
                limits:
                  memory: 1Gi

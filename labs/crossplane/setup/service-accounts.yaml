apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-providers-sa
  namespace: crossplane-system

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aws-providers-providerconfig-reader
rules:
  - apiGroups: ["aws.upbound.io"]
    resources: ["providerconfigs"]
    verbs: ["list", "get", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aws-providers-providerconfig-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aws-providers-providerconfig-reader
subjects:
  - kind: ServiceAccount
    name: aws-providers-sa
    namespace: crossplane-system

apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-providers-sa
  namespace: crossplane-system

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aws-providers-providerconfig-reader
rules:
  - apiGroups: ["aws.upbound.io"]
    resources: ["providerconfigs"]
    verbs: ["list", "get", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aws-providers-providerconfig-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aws-providers-providerconfig-reader
subjects:
  - kind: ServiceAccount
    name: aws-providers-sa
    namespace: crossplane-system

---

# Every AWS provider in this workshop runs as the SAME ServiceAccount (set in the
# DeploymentRuntimeConfig, so one EKS Pod Identity association covers them all). With a
# shared ServiceAccount the providers cannot rely on the per-provider roles the Crossplane
# RBAC manager generates: measured on 2026-10-09 on a fresh cluster, those roles covered only
# the apigatewayv2 and lambda groups, the RBAC manager restarted with "leader election lost"
# under API throttling, and provider-aws-ec2 logged 1020 "forbidden" list errors. Its cache
# never synced, so its conversion webhook never opened port 9443 and every Composition failed
# with "conversion webhook ... connection refused". This role grants the shared ServiceAccount
# what the providers need for the API groups installed in section 2.4, independent of the
# RBAC manager's timing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aws-providers-managed-resources
rules:
  - apiGroups:
      - aws.upbound.io
      - aws.m.upbound.io
      - ec2.aws.upbound.io
      - rds.aws.upbound.io
      - iam.aws.upbound.io
      - lambda.aws.upbound.io
      - apigatewayv2.aws.upbound.io
      - s3.aws.upbound.io
      - cloudfront.aws.upbound.io
      - secretsmanager.aws.upbound.io
      # installed in 2.4.5 (nested compositions)
      - dynamodb.aws.upbound.io
      - apigateway.aws.upbound.io
      - cloudwatchlogs.aws.upbound.io
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aws-providers-managed-resources-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aws-providers-managed-resources
subjects:
  - kind: ServiceAccount
    name: aws-providers-sa
    namespace: crossplane-system

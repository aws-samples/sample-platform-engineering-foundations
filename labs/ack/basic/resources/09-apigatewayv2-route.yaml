apiVersion: apigatewayv2.services.k8s.aws/v1alpha1
kind: Route
metadata:
  name: serverless-app-route
  namespace: default
spec:
  apiID: API_ID    # Replace with the API Gateway ID from step 07
  routeKey: "ANY /"
  target: integrations/INTEGRATION_ID    # Replace with the Integration ID from step 08

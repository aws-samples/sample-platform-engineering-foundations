# app-config.workshop.yaml
# RUNTIME overrides for the workshop deploy on EKS.
#
# Loaded as the last layer:
#   node packages/backend --config app-config.yaml \
#                         --config app-config.genai.yaml \
#                         --config app-config.workshop.yaml
#
# We do not use the scaffold's app-config.production.yaml because it requires a
# PostgreSQL (POSTGRES_HOST/PORT/USER/PASSWORD). For the workshop we keep the
# in-memory better-sqlite3 the scaffold already configures: the catalog is
# re-read from the example files on every start, which is enough for the lab
# and removes an infrastructure dependency. In production, use a managed database.

app:
  title: PSP Workshop Portal
  # Injected by the Kubernetes Deployment. It must be the URL the BROWSER
  # uses, including the IDE proxy prefix:
  #   https://<ide-cloudfront-domain>/proxy/7007
  # Backstage generates its own bundle paths from this value, so a wrong value
  # results in a blank page, with no visible error.
  baseUrl: ${APP_BASE_URL}

organization:
  name: PSP Workshop

auth:
  providers:
    guest:
      # The image runs with NODE_ENV=production, and in that mode Backstage
      # REFUSES the `guest` provider unless this flag is explicitly on -
      # without it the login returns 403 and the participant never enters the portal.
      #
      # The parameter name is a deliberate warning from Backstage itself: guest
      # login authenticates no one, every visitor enters as the same user.
      # That is acceptable for an ephemeral lab and NOT acceptable in
      # production - there, configure a real provider (OIDC, GitHub, etc.).
      dangerouslyAllowOutsideDevelopment: true

backend:
  baseUrl: ${APP_BASE_URL}
  listen: ':7007'
  cors:
    origin: ${APP_BASE_URL}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  csp:
    # Backstage applies, by default, Helmet's `upgrade-insecure-requests`
    # directive, which instructs the BROWSER to rewrite every http:// request
    # as https://.
    #
    # On the workshop's normal path (the IDE proxy) the portal is already
    # served over HTTPS and the directive would be harmless. It is disabled
    # because of the HTTP accesses: `kubectl port-forward` straight to
    # http://localhost:7007, or an HTTP endpoint without a certificate. In
    # those cases the page loads, the browser tries to fetch all the JavaScript
    # over HTTPS, finds nothing and the screen stays BLANK.
    #
    # The symptom is misleading: `curl` works normally (it does not apply CSP)
    # and /api/aws-genai/health answers ok, giving the impression everything is
    # fine while the browser renders nothing.
    #
    # Passing `false` removes the directive (a Backstage-supported mechanism to
    # turn off Helmet defaults). In production, serve the portal over HTTPS
    # with a proper certificate and keep the directive on.
    upgrade-insecure-requests: false

catalog:
  # IMPORTANT PATH FIX.
  # The app-config.yaml generated by the scaffold points the catalog at
  # `../../examples/entities.yaml`, because in development mode the process
  # runs from `packages/backend`. In the production image the working
  # directory is `/app`, so that path resolves outside the image, the
  # ingestion finds nothing and the catalog stays EMPTY - with no obvious error
  # in the logs, just a catalog without entities and an agent answering that it
  # found nothing.
  #
  # Lists in Backstage configuration REPLACE the previous layer, so declaring
  # locations here fully discards the scaffold's paths.
  locations:
    - type: file
      target: ./examples/entities.yaml
    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]

search:
  collators:
    catalog:
      # The catalog collator default indexes every 10 minutes, which would make
      # the participant wait before search actions return results. We lower the
      # interval so the lab flows.
      schedule:
        initialDelay: { seconds: 15 }
        frequency: { minutes: 2 }
        timeout: { minutes: 2 }

# ---------------------------------------------------------------------------
# Kubernetes plugin: the Kubernetes tab on the entity pages.
# The pod already runs INSIDE cluster 1 with a service account - the
# serviceAccount provider uses exactly that identity, no new credential. The
# minimal RBAC (get/list/watch on the types the tab shows) goes in the manifest.
# An entity binds to the resources via annotation:
#   backstage.io/kubernetes-label-selector: app=<label>
# ---------------------------------------------------------------------------
kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: psp-cluster-1-platform
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          skipTLSVerify: false
          caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          # EKS Auto Mode ships no metrics-server; without this flag every tab
          # load shows "problem retrieving Kubernetes objects" due to a 404 on
          # /apis/metrics.k8s.io (measured in event fb1c47c8), even with the
          # workloads rendering normally.
          skipMetricsLookup: true

# ---------------------------------------------------------------------------
# Argo CD plugin (Roadie frontend): the Argo CD tab on the entity pages.
# This workshop's Argo CD is the EKS Capability - the endpoint is the
# capability's and the token is read from a Secret mounted as an env var
# (ARGOCD_AUTH_TOKEN), created in module 2.2.1. Without the Secret the tab
# shows the configuration error, which the configuration page uses as a
# diagnostic exercise.
# An entity binds to an application via annotation:
#   argocd/app-name: <application>
# ---------------------------------------------------------------------------
proxy:
  endpoints:
    '/argocd/api':
      target: ${ARGOCD_SERVER_URL}/api/v1/
      changeOrigin: true
      secure: false
      headers:
        Authorization: "Bearer ${ARGOCD_AUTH_TOKEN}"
